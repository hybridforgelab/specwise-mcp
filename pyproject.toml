[project]
name = "hybridforgelab-specwise-mcp"
version = "0.3.0"
description = "Moved to bytestay-specwise-mcp. This package only installs bytestay-specwise-mcp and forwards to it."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "ByteStay", email = "hello@bytestay.pt" }]
dependencies = ["bytestay-specwise-mcp>=0.2.4"]
classifiers = [
    "Development Status :: 7 - Inactive",
    "Programming Language :: Python :: 3",
]

[project.urls]
Homepage = "https://specwise.bytestay.pt"
Repository = "https://github.com/Bytestay/specwise-mcp"
"New package" = "https://pypi.org/project/bytestay-specwise-mcp/"

[project.scripts]
specwise-mcp = "hybridforgelab_specwise_mcp:main"
hybridforgelab-specwise-mcp = "hybridforgelab_specwise_mcp:main"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hybridforgelab_specwise_mcp"]

[tool.pytest.ini_options]
addopts = "-q --cov=hybridforgelab_specwise_mcp --cov-report=term-missing:skip-covered --cov-fail-under=100"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
