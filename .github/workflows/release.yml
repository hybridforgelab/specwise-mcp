name: Release

# Final bridge release: hybridforgelab-specwise-mcp only forwards to bytestay-specwise-mcp (Hybrid Forge Lab is now ByteStay).
# Run by hand to publish the version in pyproject.toml to PyPI with Trusted Publishing (no token stored).
# This file name is the registered trusted publisher. No release-please and no MCP registry here.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Build
        run: uv build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
