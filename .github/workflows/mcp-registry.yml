name: MCP registry

# Publishes server.json to the official MCP registry (registry.modelcontextprotocol.io).
# GitHub OIDC proves the run belongs to the hybridforgelab org, which the interactive
# login can't do for an org namespace. No secret is stored.
# Called by release.yml after the PyPI publish, or run by hand.
on:
  workflow_call:
  workflow_dispatch:
    inputs:
      deprecate_to:
        description: "Instead of publishing, mark every version deprecated and point to this server (e.g. io.github.Bytestay/distill-mcp)"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      MCP_PUBLISHER_VERSION: v1.8.7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
      - name: Validate server.json
        run: ./mcp-publisher validate
      - name: Authenticate to the MCP registry
        run: ./mcp-publisher login github-oidc
      - name: Publish
        if: ${{ !inputs.deprecate_to }}
        run: ./mcp-publisher publish
      - name: Deprecate every version (moved to ByteStay)
        if: ${{ inputs.deprecate_to }}
        env:
          DEPRECATE_TO: ${{ inputs.deprecate_to }}
        run: |
          set -euo pipefail
          name="$(jq -r .name server.json)"
          pkg="$(jq -r '.packages[0].identifier' server.json)"
          ./mcp-publisher status --status deprecated --all-versions --yes \
            --message "Moved to $DEPRECATE_TO (PyPI: ${pkg/hybridforgelab-/bytestay-})" "$name"
