name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: pytest · ruff (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Install
        run: |
          uv venv -p ${{ matrix.python }} .venv
          uv pip install --python .venv/bin/python -e ".[dev]"
      - name: Tests (no network, 100% coverage)
        run: .venv/bin/pytest
      - name: Lint
        run: .venv/bin/ruff check src tests scripts
      - name: Build
        run: uv build
